dependencies:
  idf: ">=5.5"
  # Simple decoder for the reply player: MP3 and WAV (16-bit PCM) containers.
  # The Kconfig below limits which decoders and parsers are registered, so the
  # prebuilt library does not drag in the codecs the firmware never uses.
  espressif/esp_audio_codec: "^2.6.2"
  # The ES8311 and ES7210 drivers, the I2S data interface and the shared
  # esp_codec_dev wrapper all come from this component.
  espressif/esp_codec_dev: "~1.5.6"
  # mDNS is no longer part of ESP-IDF as of v5.5, so it comes from the
  # component registry instead.
  espressif/mdns: "^1.15"
  # TFLite Micro runs the microWakeWord model. The version and the esp-nn pin
  # are the pair ESPHome ships: esp-nn 1.2.x produced wrong outputs and needed a
  # larger tensor arena than this board can spare.
  espressif/esp-tflite-micro: "1.3.3~1"
  espressif/esp-nn: "1.1.2"
  # The spectrogram frontend that microWakeWord models are trained against.
  esphome/esp-micro-speech-features: "1.2.3"
  # The CO5300 in this panel accepts the SH8601 QSPI command set, which is the
  # driver Waveshare's own ESP-IDF example uses for it.
  espressif/esp_lcd_sh8601: "~2.0.1"
  # ESP LVGL port owns the LVGL task, tick and mutex; the display module only
  # calls its lock around widget updates.
  espressif/esp_lvgl_port: "^2.9.0"
  # LVGL 9.5 is the version Waveshare's ESP-IDF example builds against. The
  # 9.6 release is not needed by this screen and has not been tried on it.
  lvgl/lvgl: "~9.5.0"
